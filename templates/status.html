<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สถานะตู้กุญแจ | Smart Key Box 3</title>
<style>
:root{color-scheme:light;--page:#edf0f6;--panel:#fff;--text:#172235;--muted:#728099;--border:#e8ebf0;--good:#d9f8e5;--goodtext:#086d38;--bad:#fff0d9;--badtext:#a45600;--surface:#f1f4fa}
html[data-theme=dark]{color-scheme:dark;--page:#10151e;--panel:#202a39;--text:#eef3fb;--muted:#a9b7cd;--border:#354254;--good:#1e4e37;--goodtext:#a4f5c4;--bad:#604326;--badtext:#ffdaa1;--surface:#182230}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px Tahoma,'Segoe UI',sans-serif}.wrap{max-width:800px;margin:28px auto;padding:0 16px 28px}.shell{background:var(--surface);border-radius:17px;padding:12px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 8px 15px}.headtitle{display:flex;align-items:center;gap:12px}.emblem{display:grid;place-items:center;background:var(--panel);width:34px;height:34px;border-radius:50%;font-size:18px}.title{font-weight:700;font-size:17px}.muted{font-size:11px;color:var(--muted);margin-top:4px}.theme{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 13px;border-radius:25px;cursor:pointer;font:inherit}.summary{background:var(--panel);border-radius:12px;padding:15px 13px;margin-bottom:12px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.key{background:var(--panel);border-radius:12px;padding:13px 10px;min-height:76px}.small{font-size:11px;color:var(--muted)}.keyname{font-weight:600;margin:5px 0}.pill{display:inline-block;border-radius:20px;background:var(--good);color:var(--goodtext);padding:3px 9px;font-size:12px}.pill.busy{background:var(--bad);color:var(--badtext)}.panel{background:var(--panel);border-radius:12px;margin-top:12px;padding:16px 13px}.panel h2{font-size:17px;margin:0 0 7px}.scroll{max-height:220px;overflow:auto;margin-top:14px;scrollbar-width:thin}.history{border-collapse:collapse;width:100%;min-width:440px}.history th{text-align:left;position:sticky;top:0;background:var(--panel);font-size:13px;padding:8px 5px;border-bottom:1px solid var(--border)}.history td{padding:10px 5px;border-bottom:1px solid var(--border)}.history tr:last-child td{border-bottom:0}.error{color:#d43c3c}.foot{text-align:center;color:var(--muted);font-size:10px;padding:15px 0 1px}@media(max-width:580px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{margin:10px auto;padding:0 10px 20px}}
</style></head><body><main class="wrap"><div class="shell"><header class="head"><div class="headtitle"><span class="emblem">🔑</span><div><div class="title">สถานะตู้กุญแจ</div><div class="muted">Smart Key Box 3</div></div></div><button class="theme" id="theme" type="button">🌙 มืด</button></header><div id="summary" class="summary">กำลังโหลดข้อมูล...</div><div id="keys" class="grid"></div><section class="panel"><h2>ประวัติการยืม-คืนล่าสุด</h2><div class="small">เลื่อนขึ้น-ลงเพื่อดูรายการเพิ่มเติม</div><div id="history" class="scroll"></div></section><div class="foot" id="updated">อัปเดตข้อมูลอัตโนมัติทุก 5 วินาที</div></div></main>
<script>
const root=document.documentElement,button=document.getElementById('theme');
function applyTheme(t){root.dataset.theme=t;button.textContent=t==='dark'?'☀️ สว่าง':'🌙 มืด';try{localStorage.setItem('skb-theme',t)}catch(e){}}
let saved='light';try{saved=localStorage.getItem('skb-theme')||'light'}catch(e){}applyTheme(saved);
button.onclick=()=>applyTheme(root.dataset.theme==='dark'?'light':'dark');
function el(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!==undefined)n.textContent=String(content);return n}
function fmt(s){if(!s)return '-';const d=new Date(s);return Number.isNaN(d.getTime())?String(s):d.toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
async function load(){try{const res=await fetch('/api/public/status',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const keys=data.keys||[];const free=keys.filter(k=>k.status==='available').length;document.getElementById('summary').textContent=`ทั้งหมด ${keys.length} ช่อง · ว่าง ${free} ช่อง · ถูกยืม ${keys.length-free} ช่อง`;
const grid=document.getElementById('keys');grid.replaceChildren(...keys.map(k=>{const card=el('article','key');card.append(el('div','small','ช่อง '+k.key_id),el('div','keyname','🔑 '+k.key_name),el('span','pill'+(k.status==='available'?'':' busy'),k.status==='available'?'● ว่าง':'● ถูกยืม'));return card}));
const wrap=document.getElementById('history'),pos=wrap.scrollTop;const rows=data.history||[];if(rows.length){const table=el('table','history'),thead=el('thead'),tr=el('tr');['เวลา','กุญแจ','รายการ'].forEach(x=>tr.append(el('th','',x)));thead.append(tr);const tbody=el('tbody');rows.forEach(h=>{const r=el('tr');r.append(el('td','',fmt(h.created_at)),el('td','',h.key_name),el('td','',h.action==='return'?'✓ คืนแล้ว':'🔑 ยืม'));tbody.append(r)});table.append(thead,tbody);wrap.replaceChildren(table)}else wrap.replaceChildren(el('p','small','ยังไม่มีประวัติการยืม-คืน'));wrap.scrollTop=pos;
document.getElementById('updated').textContent='อัปเดตล่าสุด '+new Date().toLocaleTimeString('th-TH')+' · รีเฟรชทุก 5 วินาที';}catch(err){document.getElementById('summary').textContent='ไม่สามารถเชื่อมต่อข้อมูลสถานะได้';document.getElementById('updated').textContent='โปรดลองใหม่อีกครั้ง';}}
load();setInterval(load,5000);
</script></body></html>
