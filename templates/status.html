<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สถานะ Smart Key Box 3</title><style>body{font:16px Tahoma,sans-serif;background:#f3f6fb;color:#243447;max-width:850px;margin:30px auto;padding:12px}section{background:white;border-radius:14px;padding:20px;margin:12px 0;box-shadow:0 2px 8px #1231}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.pill{color:#16834b}</style><h1>🔑 Smart Key Box 3</h1><p>สถานะตู้กุญแจ (อ่านอย่างเดียว)</p><section><h2 id="control">กำลังโหลด...</h2><p>เวลาให้บริการ 07:00–19:00 น.</p></section><div class="grid" id="keys"></div><p id="error"></p><script>async function load(){try{const r=await fetch('/api/public/status');if(!r.ok)throw Error('โหลดไม่สำเร็จ');const d=await r.json();document.getElementById('control').textContent=d.control.label;document.getElementById('keys').replaceChildren(...d.keys.map(k=>{let s=document.createElement('section');let h=document.createElement('h3');h.textContent=k.key_name;let p=document.createElement('p');p.textContent=k.status==='borrowed'?'ถูกยืม':'ว่าง';s.append(h,p);return s}));document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent='ไม่สามารถเชื่อมต่อระบบได้'}}load();setInterval(load,5000)</script></html>
